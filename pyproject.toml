[project]
name = "room-classifier"
version = "0.1.0"
description = "Training pipeline for a MUD room-environment classifier (SetFit/MiniLM to ONNX)"
authors = [
    { name = "YouCantGoThatWay", email = "330908758+YouCantGoThatWay@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
    "numpy>=2.5.3",
    "onnx>=1.22.0",
    "onnxruntime>=1.30.0",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.0.1",
    "setfit>=1.2.0",
    "tokenizers>=0.23.2",
    "torch>=2.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: downloads models / long-running; deselect with -m 'not slow'"]

[tool.setuptools]
packages = ["common", "sources", "labeling", "training", "eval", "export"]

[tool.uv]
package = false
